version: 2

updates:
  # Actions are pinned to commit SHAs, which never move on their own. Without
  # this, a pin is frozen forever and an upstream security fix never arrives.
  # Dependabot bumps the SHA and rewrites the trailing version comment, so the
  # pins stay pins and sha_pinning_required stays satisfied.
  #
  # No pip entry: the scripts are standard library only and there is no
  # requirements file or pyproject to watch.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
